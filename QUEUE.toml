# lkml-reviewer improvement queue: run by scripts/queue-runner.sh on the
# monitoring box, one item at a time, emails at each step (docs/OPERATIONS.md,
# "The improvement queue"). Item scripts read hosts from .status.env.
# Edit freely: add, reorder, remove. State is in data/queue/state.json.

[[item]]
id = "v4-adapter-fetch"
title = "Fetch v4's adapter from the cluster (the Mac work needn't wait for judging)"
run = "scripts/q/v4-adapter-fetch.sh"
est_min = 3
when = "scripts/q/ready.sh v4adapter"

[[item]]
id = "v4-fetch"
title = "Fetch v4 results and adapter from the cluster"
run = "scripts/q/v4-fetch.sh"
est_min = 5
when = "scripts/q/ready.sh v4done"

[[item]]
id = "v4-mac-convert"
title = "Build v4 MLX 8-bit on the Mac"
run = "scripts/q/v4-mac-convert.sh"
est_min = 75
after = ["v4-adapter-fetch"]
when = "scripts/q/ready.sh mac"

[[item]]
id = "v4-multisample"
title = "Start v4 multi-sample generation on the Mac (200 patches x 3)"
run = "scripts/q/v4-multisample.sh"
est_min = 3
after = ["v4-mac-convert"]
when = "scripts/q/ready.sh mac"

[[item]]
id = "multisample-report"
title = "Multi-sample report: v3 vs v4 with noise floors"
run = "scripts/q/multisample-report.sh"
est_min = 5
after = ["v4-multisample"]
when = "scripts/q/ready.sh mac"

[[item]]
id = "dpo-smoke"
title = "DPO smoke test on the cluster (synthetic pairs, 2 steps; mechanics only)"
run = "scripts/q/dpo-smoke.sh"
est_min = 45
after = ["v4-fetch"]          # after v4's judging: the cluster is free and run-4 is final
when = "scripts/q/ready.sh cluster"
window = true

[[item]]
id = "v5-candidates"
title = "v5: generate 4 reviews per patch for 800 training patches (cluster)"
run = "scripts/q/v5-candidates.sh"
est_min = 280          # one round of two chunks; resumes across windows (exit 75)
after = ["v4-fetch", "multisample-report"]   # the report picks the starting model (data/v5/BASE)
when = "scripts/q/ready.sh cluster"
window = true

[[item]]
id = "v5-score"
title = "v5: judge scores every candidate, then best-vs-worst pairs"
run = "scripts/q/v5-score.sh"
est_min = 60           # uses whatever the window has left; resumes (exit 75)
after = ["v5-candidates"]
when = "scripts/q/ready.sh cluster"
window = true

[[item]]
id = "v5-check-pack"
title = "v5: reading pack of 20 preference pairs"
run = "scripts/q/v5-check-pack.sh"
est_min = 2
after = ["v5-score"]

[[item]]
id = "v5-human-check"
title = "v5: read 20 pairs in data/v5/CHECK.md (is CHOSEN really better?)"
run = "true"
after = ["v5-check-pack"]
gate = "human"
# After approval: add v5-dpo-smoke, v5-dpo-train, v5-eval here (docs/PLAN-v5.md).

# Asked by Nick 2026-11-13: does v5 (DPO) loop less under greedy decoding?
# Waits for a v5 MLX build at ~/lkml-mac/v5/mlx-8bit (the v5 convert item, to be
# added after the human check, must build it there).
[[item]]
id = "greedy-loops"
title = "Start greedy-decoding loop check on the Mac: v3, v4, v5"
run = "scripts/q/greedy-loops.sh"
est_min = 3
after = ["v5-human-check"]
when = "scripts/q/ready.sh v5mac"

[[item]]
id = "greedy-loops-report"
title = "Greedy-decoding loop rate: v3 / v4 / v5"
run = "scripts/q/greedy-loops-report.sh"
est_min = 2
after = ["greedy-loops"]
when = "scripts/q/ready.sh mac"
